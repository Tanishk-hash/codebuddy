<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeBuddy - Personal Coding Tutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    
    .app-container { 
      width: 100%; 
      max-width: 620px; 
      background: #1e293b; 
      border-radius: 12px; 
      display: flex; 
      flex-direction: column; 
      height: 680px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
      overflow: hidden; 
      border: 1px solid #334155; 
    }
    
    .app-header { 
      padding: 0.85rem 1.2rem; 
      background: #334155; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      border-bottom: 1px solid #475569;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tab-nav {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 0.65rem 1rem;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .tab-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .tab-content.active {
      display: flex;
    }

    .score-badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .action-btn {
      color: #fff;
      border: none;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .export-btn { background: #059669; }
    .export-btn:hover { background: #047857; }
    .clear-btn { background: #ef4444; }
    .clear-btn:hover { background: #dc2626; }
    
    .chat-messages { 
      flex: 1; 
      padding: 1rem; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 0.85rem; 
    }
    
    .msg { 
      padding: 0.75rem 1rem; 
      border-radius: 8px; 
      max-width: 88%; 
      line-height: 1.5; 
      font-size: 0.95rem; 
    }
    .msg.bot { background: #1e40af; align-self: flex-start; color: #ffffff; }
    .msg.user { background: #475569; align-self: flex-end; color: #ffffff; }

    .code-block-wrapper {
      position: relative;
      margin-top: 0.5rem;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    .code-block-header {
      display: flex;
      justify-content: flex-end;
      padding: 0.35rem 0.6rem;
      background: #0b1329;
      border-bottom: 1px solid #1e293b;
    }
    .transfer-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .transfer-btn:hover { background: #7dd3fc; }

    pre {
      padding: 0.75rem;
      overflow-x: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      margin: 0;
    }
    code {
      font-family: "Courier New", Courier, monospace;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .quiz-btn {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .quiz-btn:hover:not(:disabled) {
      background: #0284c7;
      color: #fff;
    }
    .quiz-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .chip-container {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #1e293b;
      overflow-x: auto;
      border-top: 1px solid #334155;
    }
    .chip {
      background: #334155;
      color: #cbd5e1;
      padding: 0.35rem 0.75rem;
      border-radius: 16px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid #475569;
      transition: all 0.2s ease;
    }
    .chip:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .chip.quiz-highlight {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 600;
      border-color: #fbbf24;
    }

    .chat-input-area { 
      display: flex; 
      padding: 0.75rem; 
      background: #1e293b; 
      border-top: 1px solid #334155; 
      gap: 0.5rem; 
    }
    input[type="text"] { 
      flex: 1; 
      padding: 0.75rem; 
      border-radius: 6px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: #fff; 
      outline: none; 
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    
    button#sendBtn, button#runBtn { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 0.75rem 1.25rem; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
      transition: background 0.2s; 
    }
    button#sendBtn:hover, button#runBtn:hover { background: #7dd3fc; }

    .playground-area {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 1rem;
      gap: 0.75rem;
      background: #0f172a;
    }
    .editor-label {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea#codeEditor {
      width: 100%;
      height: 180px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #38bdf8;
      padding: 0.75rem;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }
    textarea#codeEditor:focus { border-color: #38bdf8; }
    .console-output {
      flex: 1;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      overflow-y: auto;
      color: #a7f3d0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="app-header">
      <div class="header-left">
        <span>🤖 CodeBuddy</span>
      </div>
      <div class="header-right">
        <span class="score-badge" id="scoreDisplay">Score: 0</span>
        <button class="action-btn export-btn" onclick="exportStudyNotes()">📥 Export</button>
        <button class="action-btn clear-btn" onclick="resetChat()">Reset</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tabChatBtn" onclick="switchTab('chat')">💬 Tutor Chat</button>
      <button class="tab-btn" id="tabPlayBtn" onclick="switchTab('playground')">⚡ Code Runner</button>
    </div>
    
    <!-- Chat Screen -->
    <div class="tab-content active" id="chatTab">
      <div class="chat-messages" id="messages"></div>

      <div class="chip-container">
        <span class="chip quiz-highlight" onclick="startQuiz()">🎯 Start Quiz</span>
        <span class="chip" onclick="askTopic('What is a variable?')">Variables</span>
        <span class="chip" onclick="askTopic('How does a loop work?')">Loops</span>
        <span class="chip" onclick="askTopic('Show me a function')">Functions</span>
        <span class="chip" onclick="askTopic('How do lists work?')">Lists / Arrays</span>
      </div>

      <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <!-- Runner Screen -->
    <div class="tab-content" id="playgroundTab">
      <div class="playground-area">
        <div class="editor-label">
          <span>JavaScript Scratchpad (runs in browser)</span>
          <button id="runBtn" onclick="runCode()">▶ Run Code</button>
        </div>
        <textarea id="codeEditor">// Write short code snippets here to test them!
let total = 0;
for (let i = 1; i <= 5; i++) {
  total += i;
}
console.log("Sum 1 to 5:", total);
</textarea>
        <div class="editor-label">Output Console:</div>
        <div class="console-output" id="consoleOutput">Run code above to see output here...</div>
      </div>
    </div>

  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const consoleOutput = document.getElementById("consoleOutput");
    const codeEditor = document.getElementById("codeEditor");

    const STORAGE_KEY_CHAT = "codebuddy_chat_history";
    const STORAGE_KEY_SCORE = "codebuddy_score";

    let score = parseInt(localStorage.getItem(STORAGE_KEY_SCORE)) || 0;
    scoreDisplay.textContent = `Score: ${score}`;

    const codeSnippets = {
      variable: 'let greeting = "Hello, World!";\nlet points = 50;\nconsole.log(greeting + " Points: " + points);',
      loop: 'for (let i = 1; i <= 4; i++) {\n  console.log("Iteration number: " + i);\n}',
      function: 'function calculateSquare(num) {\n  return num * num;\n}\n\nconsole.log("Square of 6:", calculateSquare(6));',
      list: 'let skills = ["Python", "JavaScript", "SQL"];\nskills.push("Git");\nconsole.log("First item:", skills[0]);\nconsole.log("Full list:", skills);'
    };

    const quizQuestions = [
      {
        question: "What keyword is used to declare a variable that cannot be reassigned?",
        options: ["var", "let", "const", "static"],
        answer: 2,
        explanation: "<code>const</code> creates block-scoped variables that cannot be reassigned."
      },
      {
        question: "Which array method adds a new element to the end of an array?",
        options: ["push()", "pop()", "shift()", "append()"],
        answer: 0,
        explanation: "In JavaScript, <code>.push()</code> adds one or more elements to the end."
      },
      {
        question: "What is the output of <code>typeof 42</code>?",
        options: ["'int'", "'number'", "'float'", "'Integer'"],
        answer: 1,
        explanation: "JavaScript numbers (both integers and floats) return <code>'number'</code>."
      }
    ];

    let currentQuizIndex = 0;

    function buildCodeCard(codeText, snippetKey) {
      return `
        <div class="code-block-wrapper">
          <div class="code-block-header">
            <button class="transfer-btn" onclick="sendToPlayground('${snippetKey}')">▶ Try in Runner</button>
          </div>
          <pre><code>${codeText}</code></pre>
        </div>
      `;
    }

    const responses = {
      "variable": `A <b>variable</b> stores data you can reference and update later:${buildCodeCard(codeSnippets.variable, "variable")}`,
      "loop": `A <b>loop</b> lets you repeat operations without duplicating code:${buildCodeCard(codeSnippets.loop, "loop")}`,
      "function": `A <b>function</b> encapsulates repeatable logic with inputs and return values:${buildCodeCard(codeSnippets.function, "function")}`,
      "list": `A <b>list (or Array)</b> holds an ordered collection of values:${buildCodeCard(codeSnippets.list, "list")}`,
      "default": "I don't have that topic mapped yet! Try asking about <b>variables</b>, <b>loops</b>, <b>functions</b>, <b>lists</b>, click <b>🎯 Start Quiz</b>, or switch to the <b>⚡ Code Runner</b> tab."
    };

    function sendToPlayground(snippetKey) {
      const code = codeSnippets[snippetKey];
      if (!code) return;

      codeEditor.value = code;
      switchTab('playground');
      runCode();
    }

    function switchTab(tab) {
      const chatTab = document.getElementById("chatTab");
      const playgroundTab = document.getElementById("playgroundTab");
      const tabChatBtn = document.getElementById("tabChatBtn");
      const tabPlayBtn = document.getElementById("tabPlayBtn");

      if (tab === "chat") {
        chatTab.classList.add("active");
        playgroundTab.classList.remove("active");
        tabChatBtn.classList.add("active");
        tabPlayBtn.classList.remove("active");
      } else {
        chatTab.classList.remove("active");
        playgroundTab.classList.add("active");
        tabChatBtn.classList.remove("active");
        tabPlayBtn.classList.add("active");
      }
    }

    function runCode() {
      const userCode = codeEditor.value;
      consoleOutput.innerHTML = "";
      let outputBuffer = [];

      const originalLog = console.log;
      console.log = function(...args) {
        outputBuffer.push(args.map(a => (typeof a === 'object' ? JSON.stringify(a) : a)).join(" "));
        originalLog.apply(console, args);
      };

      try {
        const result = new Function(userCode)();
        if (outputBuffer.length > 0) {
          consoleOutput.textContent = outputBuffer.join("\n");
        } else if (result !== undefined) {
          consoleOutput.textContent = "Returned: " + JSON.stringify(result);
        } else {
          consoleOutput.textContent = "Code executed successfully with no output.";
        }
      } catch (err) {
        consoleOutput.innerHTML = `<span style="color: #f87171;">⚠️ ${err.name}: ${err.message}</span>`;
      } finally {
        console.log = originalLog;
      }
    }

    function exportStudyNotes() {
      const saved = localStorage.getItem(STORAGE_KEY_CHAT);
      const history = saved ? JSON.parse(saved) : [];

      let markdown = `# CodeBuddy - Study Notes & Cheatsheet\n\n`;
      markdown += `Generated: ${new Date().toLocaleDateString()}\n`;
      markdown += `Current Quiz Score: ${score} points\n\n`;
      markdown += `## 📚 Quick Cheatsheet\n\n`;

      for (const [topic, snippet] of Object.entries(codeSnippets)) {
        markdown += `### ${topic.toUpperCase()}\n\`\`\`javascript\n${snippet}\n\`\`\`\n\n`;
      }

      markdown += `## 💬 Session Q&A Log\n\n`;
      history.forEach(item => {
        const cleanText = item.html.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
        const role = item.sender === "user" ? "👤 Student" : "🤖 CodeBuddy";
        markdown += `**${role}:** ${cleanText}\n\n`;
      });

      const blob = new Blob([markdown], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "CodeBuddy_Study_Notes.md";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function loadHistory() {
      const saved = localStorage.getItem(STORAGE_KEY_CHAT);
      if (saved) {
        try {
          const history = JSON.parse(saved);
          history.forEach(item => renderMessageElement(item.html, item.sender));
        } catch (e) {
          localStorage.removeItem(STORAGE_KEY_CHAT);
          renderWelcome();
        }
      } else {
        renderWelcome();
      }
    }

    function renderWelcome() {
      appendMessage("Hi! I'm CodeBuddy. Ask a question, click a topic, or hit <b>🎯 Start Quiz</b> to test your skills!", "bot");
    }

    function renderMessageElement(htmlContent, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerHTML = htmlContent;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function appendMessage(htmlContent, sender) {
      renderMessageElement(htmlContent, sender);

      const saved = localStorage.getItem(STORAGE_KEY_CHAT);
      const history = saved ? JSON.parse(saved) : [];
      history.push({ html: htmlContent, sender: sender });
      localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(history));
    }

    function updateScore(delta) {
      score += delta;
      localStorage.setItem(STORAGE_KEY_SCORE, score.toString());
      scoreDisplay.textContent = `Score: ${score}`;
    }

    function resetChat() {
      if (confirm("Reset chat history and score?")) {
        localStorage.removeItem(STORAGE_KEY_CHAT);
        localStorage.removeItem(STORAGE_KEY_SCORE);
        messages.innerHTML = "";
        score = 0;
        scoreDisplay.textContent = `Score: 0`;
        renderWelcome();
      }
    }

    function processQuery(queryText) {
      const query = queryText.trim().toLowerCase();
      if (!query) return;

      appendMessage(queryText, "user");

      if (query.includes("quiz")) {
        startQuiz();
        return;
      }

      let reply = responses["default"];
      for (const key in responses) {
        if (query.includes(key)) {
          reply = responses[key];
          break;
        }
      }

      setTimeout(() => appendMessage(reply, "bot"), 350);
    }

    function startQuiz() {
      currentQuizIndex = 0;
      presentQuestion(currentQuizIndex);
    }

    function presentQuestion(index) {
      const q = quizQuestions[index];
      let optionsHtml = '<div class="quiz-options">';
      q.options.forEach((opt, optIndex) => {
        optionsHtml += `<button class="quiz-btn" onclick="submitAnswer(${index}, ${optIndex})">${opt}</button>`;
      });
      optionsHtml += '</div>';

      appendMessage(`<b>Quiz Question ${index + 1}/${quizQuestions.length}:</b><br>${q.question}${optionsHtml}`, "bot");
    }

    function submitAnswer(qIndex, selectedOptIndex) {
      const q = quizQuestions[qIndex];
      const buttons = document.querySelectorAll(".quiz-btn");
      buttons.forEach(btn => btn.disabled = true);

      if (selectedOptIndex === q.answer) {
        updateScore(10);
        appendMessage(`✅ <b>Correct!</b> (+10 pts)<br>${q.explanation}`, "bot");
      } else {
        appendMessage(`❌ <b>Not quite!</b> The correct answer was <b>${q.options[q.answer]}</b>.<br>${q.explanation}`, "bot");
      }

      if (qIndex + 1 < quizQuestions.length) {
        setTimeout(() => presentQuestion(qIndex + 1), 1000);
      } else {
        setTimeout(() => {
          appendMessage(`🎉 <b>Quiz Completed!</b> Current total score: <b>${score}</b>. Hit <b>🎯 Start Quiz</b> again whenever you want another round!`, "bot");
        }, 1000);
      }
    }

    function handleSend() {
      processQuery(input.value);
      input.value = "";
    }

    function askTopic(topicText) {
      processQuery(topicText);
    }

    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    loadHistory();
  </script>
</body>
</html>
